# Requirements for IT-FE. Values are fixed for the pilot; private check ids name
# evaluator-only checks that live outside this repository.
task_id: IT-FE
project: issue-tracker
area: frontend
change_type: bug
request: request.ko.md
precondition: exported baseline commit (see baselines/README.ko.md), fresh seeded database, APP_NOW pinned
public_command: "python tools/check_public.py"
private_command: "python grade.py --task IT-FE --submission SUBMISSION_DIR --private-dir PRIVATE_DIR"
private_check: IT-FE-H1
timeout_seconds:
  per_check: 120
  ui_assertion: 10
  app_startup: 15
  regression_suite: 120
regression_checks: [REG-tests]
known_baseline_failures:
  - "IT-BE and IT-INT targets (other tasks' defects) are present in the same baseline"
requirements:
  - requirement_id: IT-FE-1
    requirement_source: explicit_request
    input: "select status=open and sort=created-asc on /?project=CORE, then reload"
    expected_observable_output: "URL keeps status=open&sort=created-asc; #status-filter/#sort-order show them; list is issues 1,4,6 in that order"
  - requirement_id: IT-FE-2
    requirement_source: explicit_request
    input: "change filters to build history, then back/forward; open direct links incl. unknown values"
    expected_observable_output: "each history entry restores its filters and list; unknown status/sort fall back to all/created-desc independently with no error message"
  - requirement_id: IT-FE-REG
    requirement_source: existing_contract
    input: "empty filter result on OPS, click an issue link"
    expected_observable_output: "'No issues match these filters.' shown; detail page opens"
  - requirement_id: REG-tests
    requirement_source: existing_contract
    input: "original baseline tests/ copied over the submission"
    expected_observable_output: "python -m unittest discover -s tests passes"
