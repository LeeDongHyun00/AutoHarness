# Requirements for EV-BE. Values are fixed for the pilot; private check ids name
# evaluator-only checks that live outside this repository.
task_id: EV-BE
project: event-signup
area: backend
change_type: bug
request: request.ko.md
precondition: exported baseline commit (see baselines/README.ko.md), fresh seeded database, APP_NOW pinned
public_command: "python tools/check_public.py"
private_command: "python grade.py --task EV-BE --submission SUBMISSION_DIR --private-dir PRIVATE_DIR"
private_check: EV-BE-H1
timeout_seconds:
  per_check: 120
  ui_assertion: 10
  app_startup: 15
  regression_suite: 120
regression_checks: [REG-tests]
known_baseline_failures:
  - "EV-FE and EV-INT targets are present in the same baseline"
requirements:
  - requirement_id: EV-BE-1
    requirement_source: explicit_request
    input: "two simultaneous signups for the last seat of spring-meetup (SQL delay 100ms, barrier start)"
    expected_observable_output: "one confirmed, one waitlisted; each response status equals the stored status; event full but not over capacity"
  - requirement_id: EV-BE-2
    requirement_source: explicit_request
    input: "four simultaneous signups for design-clinic (2 seats)"
    expected_observable_output: "exactly 2 confirmed and 2 waitlisted rows; seats_left 0, never negative"
  - requirement_id: REG-tests
    requirement_source: existing_contract
    input: "original baseline tests/ copied over the submission"
    expected_observable_output: "python -m unittest discover -s tests passes"
