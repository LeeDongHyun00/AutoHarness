# Requirements for IT-INT. Values are fixed for the pilot; private check ids name
# evaluator-only checks that live outside this repository.
task_id: IT-INT
project: issue-tracker
area: integration
change_type: feature
request: request.ko.md
precondition: exported baseline commit (see baselines/README.ko.md), fresh seeded database, APP_NOW pinned
public_command: "python tools/check_public.py"
private_command: "python grade.py --task IT-INT --submission SUBMISSION_DIR --private-dir PRIVATE_DIR"
private_check: IT-INT-H1
timeout_seconds:
  per_check: 120
  ui_assertion: 10
  app_startup: 15
  regression_suite: 120
regression_checks: [REG-tests]
known_baseline_failures:
  - "IT-FE and IT-BE targets are present in the same baseline"
requirements:
  - requirement_id: IT-INT-1
    requirement_source: explicit_request
    input: "member assigns an active project member via API and via the detail page"
    expected_observable_output: "issue responses carry assignee {id,name}; list (.issue-assignee) and detail (#issue-assignee) agree; survives restart; new issues have null"
  - requirement_id: IT-INT-2
    requirement_source: explicit_request
    input: "unassign with null; assign inactive, non-member, unknown or non-integer ids; viewer attempts"
    expected_observable_output: "null clears to Unassigned; invalid assignees 400 bad_request unchanged; viewer 403 unchanged; missing issue 404"
  - requirement_id: REG-tests
    requirement_source: existing_contract
    input: "original baseline tests/ copied over the submission"
    expected_observable_output: "python -m unittest discover -s tests passes"
