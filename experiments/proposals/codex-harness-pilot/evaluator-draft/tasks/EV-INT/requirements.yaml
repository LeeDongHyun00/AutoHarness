# Requirements for EV-INT. Values are fixed for the pilot; private check ids name
# evaluator-only checks that live outside this repository.
task_id: EV-INT
project: event-signup
area: integration
change_type: feature
request: request.ko.md
precondition: exported baseline commit (see baselines/README.ko.md), fresh seeded database, APP_NOW pinned
public_command: "python tools/check_public.py"
private_command: "python grade.py --task EV-INT --submission SUBMISSION_DIR --private-dir PRIVATE_DIR"
private_check: EV-INT-H1
timeout_seconds:
  per_check: 120
  ui_assertion: 10
  app_startup: 15
  regression_suite: 120
regression_checks: [REG-tests]
known_baseline_failures:
  - "EV-FE and EV-BE targets are present in the same baseline"
requirements:
  - requirement_id: EV-INT-1
    requirement_source: explicit_request
    input: "cancel the confirmed seat of rust-workshop (seed: Ara confirmed, Bora and Chan waitlisted) via API and UI"
    expected_observable_output: "Bora confirmed with confirmed_at = clock now and null position; Chan position 1; registration pages show Cancelled / Confirmed; survives restart"
  - requirement_id: EV-INT-2
    requirement_source: explicit_request
    input: "cancel a waitlisted registration, cancel twice, cancel with an empty waitlist"
    expected_observable_output: "no extra promotion; counts stay consistent; no registration rows added"
  - requirement_id: REG-tests
    requirement_source: existing_contract
    input: "original baseline tests/ copied over the submission"
    expected_observable_output: "python -m unittest discover -s tests passes"
