# Requirements for EV-FE. Values are fixed for the pilot; private check ids name
# evaluator-only checks that live outside this repository.
task_id: EV-FE
project: event-signup
area: frontend
change_type: bug
request: request.ko.md
precondition: exported baseline commit (see baselines/README.ko.md), fresh seeded database, APP_NOW pinned
public_command: "python tools/check_public.py"
private_command: "python grade.py --task EV-FE --submission SUBMISSION_DIR --private-dir PRIVATE_DIR"
private_check: EV-FE-H1
timeout_seconds:
  per_check: 120
  ui_assertion: 10
  app_startup: 15
  regression_suite: 120
regression_checks: [REG-tests]
known_baseline_failures:
  - "EV-BE and EV-INT targets are present in the same baseline"
requirements:
  - requirement_id: EV-FE-1
    requirement_source: explicit_request
    input: "fill all four fields on event.html and submit while the signup request fails"
    expected_observable_output: "all values kept, #form-error shows a message, #submit-button enabled again, no registration stored"
  - requirement_id: EV-FE-2
    requirement_source: explicit_request
    input: "retry after failure; click repeatedly while a request is pending"
    expected_observable_output: "retry stores exactly one registration with the kept values and shows #confirmation; one POST per submission"
  - requirement_id: EV-FE-REG
    requirement_source: existing_contract
    input: "submit with an empty name"
    expected_observable_output: "field error shown and no request sent"
  - requirement_id: REG-tests
    requirement_source: existing_contract
    input: "original baseline tests/ copied over the submission"
    expected_observable_output: "python -m unittest discover -s tests passes"
