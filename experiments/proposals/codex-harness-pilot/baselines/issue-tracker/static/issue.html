<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a id="back-link" href="/">← All issues</a>
    <span id="user-name" class="muted"></span>
  </header>
  <main>
    <p id="issue-message" class="message" role="status" hidden></p>
    <article id="issue" class="card" hidden>
      <h1 id="issue-title"></h1>
      <p class="muted"><span id="issue-meta"></span></p>
      <p id="issue-description"></p>
      <form id="status-form" class="inline-form">
        <label for="status-select">Status</label>
        <select id="status-select" name="status">
          <option value="open">Open</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
        <button type="submit">Update status</button>
      </form>
      <p id="status-message" class="message error" role="alert" hidden></p>
    </article>
  </main>
  <script type="module" src="/issue.js"></script>
</body>
</html>
