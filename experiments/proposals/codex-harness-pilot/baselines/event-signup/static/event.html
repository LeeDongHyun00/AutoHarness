<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="page">
    <a href="/">← All events</a>
    <p id="event-status" role="status" hidden></p>
    <section id="event-details" hidden>
      <h1 id="event-title"></h1>
      <p id="event-when" class="muted"></p>
      <p id="event-seats" class="seats"></p>
    </section>

    <form id="signup-form" class="signup-form" novalidate hidden>
      <h2>Sign up</h2>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required>
        <p class="field-error" data-error-for="name" hidden></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" data-error-for="email" hidden></p>
      </div>
      <div class="field">
        <label for="affiliation">Affiliation <span class="muted">(optional)</span></label>
        <input id="affiliation" name="affiliation" autocomplete="organization">
        <p class="field-error" data-error-for="affiliation" hidden></p>
      </div>
      <div class="field">
        <label for="note">Accessibility or dietary notes <span class="muted">(optional)</span></label>
        <textarea id="note" name="note" rows="3"></textarea>
        <p class="field-error" data-error-for="note" hidden></p>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <button id="submit-button" type="submit">Sign up</button>
    </form>

    <section id="confirmation" class="confirmation" hidden aria-live="polite">
      <h2 id="confirmation-title"></h2>
      <p id="confirmation-detail"></p>
      <a id="manage-link" href="#">View or cancel your registration</a>
    </section>
  </main>
  <script type="module" src="/event.js"></script>
</body>
</html>
